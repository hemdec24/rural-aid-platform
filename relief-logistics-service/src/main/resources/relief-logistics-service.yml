serviceName: relief-logistics-service

database:
  driverClass: org.postgresql.Driver
  user: rural_aid
  password: rural_aid_local
  url: jdbc:postgresql://postgres:5432/relief_logistics
  validationQuery: "SELECT 1"
  initialSize: 2
  minSize: 2
  maxSize: 8

inventoryCache:
  maximumEntries: 1000
  positiveTtlMillis: 30000
  negativeTtlMillis: 5000
  consumerId: relief-logistics-local
  pollIntervalMillis: 250
  maximumPollStalenessMillis: 2000
  eventBatchSize: 100
  maximumCatchupBatches: 10

server:
  applicationConnectors:
    - type: http
      port: 8090

  adminConnectors:
    - type: http
      port: 8091
